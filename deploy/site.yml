# Publishes www/ to GitHub Pages, and every 10 minutes fetches the newest items from the
# official and community feeds (server/refresh.py) so the public site stays fresh with no
# computer switched on. The researched Arabic/English stories come from the hourly Claude
# cloud routine (see CLOUD_TASK.md), which pushes to main, or to a claude/** branch that
# the "merge" job folds into main before republishing.
name: Update and publish the site

on:
  push:
    branches: [main, "claude/**"]
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:

permissions:
  contents: write   # save live.json and merge the routine's branches
  actions: write    # start a publish run after a merge
  pages: write
  id-token: write

jobs:
  merge:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    concurrency:
      group: merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge the cloud routine's update into main and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "marsad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="${GITHUB_REF#refs/heads/}"
          git fetch origin "$BR"
          git merge --no-edit -X theirs "origin/$BR"
          git push origin HEAD:main
          git push origin --delete "$BR" || true
          gh workflow run site.yml --ref main

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the latest news from the official and community sources
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            pip install --quiet anthropic   # optional: writes the Arabic text for new items
          else
            export MARSAD_TRANSLATE=0
          fi
          python3 server/refresh.py

      - name: Save the new items
        if: github.event_name != 'push'
        run: |
          git config user.name "marsad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/data/live.json
          if ! git diff --cached --quiet; then
            git commit -m "News feed refresh"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
