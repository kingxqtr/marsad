<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المرصد</title>
<meta name="description" content="أخبار Once Human وStar Citizen وأدوات الذكاء الاصطناعي من المصادر الرسمية والمجتمع — بالعربية والإنجليزية.">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)" data-standalone>
<meta name="theme-color" content="#0a0e15" media="(prefers-color-scheme: dark)" data-standalone>
<meta name="apple-mobile-web-app-capable" content="yes" data-standalone>
<meta name="apple-mobile-web-app-title" content="المرصد" data-standalone>
<link rel="manifest" href="manifest.webmanifest" data-standalone>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" data-standalone>
<link rel="apple-touch-icon" href="assets/icon-180.png" data-standalone>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<script>
  (function () {
    var d = document.documentElement, l = null, t = null;
    try { l = localStorage.getItem('marsad:lang'); t = localStorage.getItem('marsad:theme'); } catch (e) {}
    if (l === 'en') { d.lang = 'en'; d.dir = 'ltr'; } else { d.lang = 'ar'; d.dir = 'rtl'; }
    if (t === 'dark' || t === 'light') d.setAttribute('data-theme', t);
  })();
</script>
</head>

<a class="skip-link" href="#main" data-i18n="skip">تخطَّ إلى الأخبار</a>

<header class="masthead">
  <div class="wrap masthead__row">
    <a class="brand" href="#once-human" id="brand">
      <span class="brand__mark"><svg class="ico" aria-hidden="true"><use href="#i-radar"/></svg></span>
      <span class="brand__text">
        <span class="brand__name" data-i18n="brand">المرصد</span>
        <span class="brand__tag" data-i18n="tagline">أخبار من المصادر الرسمية والمجتمع</span>
      </span>
    </a>

    <nav class="tabbar" id="tabbar" aria-label="الأقسام">
      <div class="tablist" role="tablist" id="tablist">
        <button class="tab" role="tab" type="button" id="tab-once-human" data-tab="once-human" aria-controls="panel" aria-selected="true">
          <svg class="ico" aria-hidden="true"><use href="#i-mask"/></svg><span class="tab__label">ونس هيومن</span><span class="tab__badge" hidden></span>
        </button>
        <button class="tab" role="tab" type="button" id="tab-star-citizen" data-tab="star-citizen" aria-controls="panel" aria-selected="false" tabindex="-1">
          <svg class="ico" aria-hidden="true"><use href="#i-planet"/></svg><span class="tab__label">ستار سيتيزن</span><span class="tab__badge" hidden></span>
        </button>
        <button class="tab" role="tab" type="button" id="tab-ai" data-tab="ai" aria-controls="panel" aria-selected="false" tabindex="-1">
          <svg class="ico" aria-hidden="true"><use href="#i-chip"/></svg><span class="tab__label">أدوات الذكاء الاصطناعي</span><span class="tab__badge" hidden></span>
        </button>
      </div>
    </nav>

    <div class="actions">
      <button class="btn btn--primary btn--refresh" type="button" id="refresh-btn">
        <svg class="ico" aria-hidden="true"><use href="#i-refresh"/></svg>
        <span class="btn__label" data-i18n="refresh">تحديث</span>
      </button>
      <button class="btn btn--lang" type="button" id="lang-btn" lang="en">EN</button>
      <button class="btn btn--icon" type="button" id="theme-btn">
        <svg class="ico" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1">
<div class="panel" id="panel" role="tabpanel" aria-labelledby="tab-once-human">
  <section class="intro" aria-labelledby="intro-title">
    <div class="intro__text">
      <p class="eyebrow" id="intro-eyebrow">Once Human</p>
      <h1 id="intro-title">ونس هيومن</h1>
      <p class="intro__desc" id="intro-desc"></p>
    </div>
    <dl class="stats" id="stats"></dl>
  </section>

  <div class="notice" id="notice" role="note" hidden>
    <svg class="ico" aria-hidden="true"><use href="#i-alert"/></svg>
    <p id="notice-text"></p>
  </div>

  <section class="block" aria-labelledby="up-title">
    <div class="block__head">
      <h2 id="up-title" data-i18n="upcoming">القادم</h2>
      <p class="block__sub" data-i18n="upcomingSub">أقرب 6 فعاليات وإصدارات قادمة</p>
    </div>
    <ol class="up-grid" id="up-grid"></ol>
  </section>

  <section class="block" aria-labelledby="news-title">
    <div class="block__head block__head--news">
      <div class="block__titles">
        <h2 id="news-title" data-i18n="latest">آخر الأخبار</h2>
        <p class="block__sub" id="news-sub"></p>
      </div>
      <button class="saved-toggle" type="button" id="saved-toggle" aria-pressed="false">
        <svg class="ico" aria-hidden="true"><use href="#i-bookmark"/></svg>
        <span id="saved-label">المحفوظة</span>
        <span class="saved-toggle__count" id="saved-count">0</span>
      </button>
    </div>
    <div class="news__layout">
      <aside class="filters" id="filters">
        <label class="search">
          <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="search" id="q" autocomplete="off" enterkeyhint="search">
        </label>
        <div class="filter-group">
          <p class="filter-group__label" id="lbl-source" data-i18n="sourceFilter">المصدر</p>
          <div class="seg" role="radiogroup" aria-labelledby="lbl-source" id="source-seg">
            <button type="button" role="radio" data-source="all" aria-checked="true" data-i18n="all">الكل</button>
            <button type="button" role="radio" data-source="official" aria-checked="false" data-i18n="official">رسمي</button>
            <button type="button" role="radio" data-source="community" aria-checked="false" data-i18n="community">مجتمع</button>
          </div>
        </div>
        <div class="filter-group">
          <p class="filter-group__label" data-i18n="typeFilter">النوع</p>
          <div class="chips" id="type-chips"></div>
        </div>
        <div class="filter-group" id="company-group" hidden>
          <p class="filter-group__label" data-i18n="companyFilter">الشركة</p>
          <div class="chips" id="company-chips"></div>
        </div>
      </aside>
      <div class="feed" id="feed"></div>
    </div>
    <div class="feed__more"><button class="btn btn--ghost" type="button" id="more-btn" hidden></button></div>
    <p class="sr-only" id="feed-status" role="status" aria-live="polite"></p>
  </section>
</div>
</main>

<footer class="footer wrap">
  <p id="foot-coverage"></p>
  <p data-i18n="footNote">كل الأخبار من مصادر رسمية أو مجتمعية، والملخصات مكتوبة بأسلوبنا مع رابط للخبر الأصلي.</p>
  <p class="footer__mode"><span class="status-dot" id="mode-dot"></span><span id="foot-mode"></span></p>
</footer>

<dialog class="sheet" id="details" aria-labelledby="d-title">
  <div class="sheet__inner">
    <div class="sheet__head">
      <div class="sheet__meta" id="d-meta"></div>
      <button class="btn btn--icon" type="button" id="d-close"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet__body">
      <h2 class="sheet__title" id="d-title"></h2>
      <div class="sheet__when" id="d-when"></div>
      <p class="sheet__lede" id="d-lede"></p>
      <div class="prose" id="d-body"></div>
      <p class="sheet__note" id="d-note" hidden></p>
      <p class="sheet__source" id="d-source"></p>
    </div>
    <div class="sheet__actions" id="d-actions"></div>
  </div>
</dialog>

<dialog class="sheet sheet--small" id="share" aria-labelledby="s-title">
  <div class="sheet__inner">
    <div class="sheet__head">
      <h2 id="s-title">مشاركة الخبر</h2>
      <button class="btn btn--icon" type="button" id="s-close"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <p class="share__headline" id="s-headline"></p>
    <div class="share__grid" id="s-grid"></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="data/news-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
