<title>__REPORT_TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="__REPORT_DESC__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: "Observatory dossier" - one column of numbered instrument panels on the
   user's light paper; a star-chart hero, HUD corner ticks and blue data ink.
   Identity tokens below come from the user's skill (v1.2.0) and must not drift. */
:root{
  --bg:#F2F1ED; --panel:#FFFFFF; --line:#DDDBD5; --surface:#F7F6F2;
  --ink:#141414; --ink-2:#525252; --ink-3:#77746C;
  --blue:#1B5FA3; --blue-soft:#EAF2FB; --blue-mid:#C9DCF1;
  --amber:#9A6010; --amber-soft:#FEF7EC; --amber-line:#FDE9C4;
  --green:#1A6E45; --green-soft:#EBF7F2;
  --red:#B3261E; --red-soft:#FCEDEC;
  --violet:#6B4FA0; --violet-soft:#F1EDF8;
  --head:#141414; --on-head:#FFFFFF;
  --shadow:0 1px 2px rgb(20 20 20 / .05), 0 10px 30px -12px rgb(20 20 20 / .14);
  --font-head:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-num:"Chakra Petch", "IBM Plex Sans Arabic", ui-monospace, monospace;
  --radius:16px; --radius-sm:10px;
  color-scheme:light;
}
html{font-size:118%;-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:7.5rem}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:500;line-height:1.85;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:rgb(242 241 237 / .96)}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.num,.n{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ltr{direction:ltr;unicode-bidi:isolate}
.lat{font-family:var(--font-num);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.muted{color:var(--ink-2)}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgb(242 241 237 / .96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:.8rem;min-height:3.4rem}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:2rem;height:2rem;flex:none}
.brand b{font-family:var(--font-head);font-weight:700;font-size:1rem;white-space:nowrap}
.brand small{display:block;font-family:var(--font-num);font-size:.9rem;color:var(--ink-2);letter-spacing:.08em;line-height:1.1}
.nav{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-block:.5rem;mask-image:linear-gradient(to left,#000 88%,transparent)}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--ink-2);font-size:.9rem;font-weight:600;padding:.25rem .7rem;border-radius:999px;border:1px solid transparent;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.nav a:hover{color:var(--ink);border-color:var(--line)}
.nav a.on{background:var(--ink);color:#fff}
.icon-btn{flex:none;display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.3rem .8rem;font-size:.9rem;font-weight:600}
.icon-btn svg{width:1.1rem;height:1.1rem}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(120% 90% at 85% 10%,#FFFFFF 0%,var(--bg) 62%)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;padding-block:2.2rem 2rem}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:2rem;align-items:center}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;color:var(--blue);font-weight:700;font-size:.95rem}
.eyebrow .lat{color:var(--ink-2);font-size:.9rem}
.eyebrow i{width:.5rem;height:.5rem;border-radius:50%;background:var(--blue);display:inline-block;box-shadow:0 0 0 4px var(--blue-soft);animation:blip 2.4s ease-in-out infinite}
@keyframes blip{50%{box-shadow:0 0 0 9px rgb(27 95 163 / 0)}}
.ship-name{font-family:var(--font-num);font-weight:700;font-size:clamp(2.6rem,7.5vw,5.2rem);line-height:1.02;letter-spacing:.01em;margin-block:.4rem .3rem;direction:ltr;text-align:right;unicode-bidi:plaintext}
.ship-role{font-size:1.15rem;color:var(--ink);font-weight:600}
.ship-maker{color:var(--ink-2);font-weight:600;margin-top:.15rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-block:.9rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.15rem .75rem;font-size:.9rem;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green);border-color:#CBE8DA}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.chip.bad{background:var(--red-soft);color:var(--red);border-color:#F2C9C5}
.chip.blue{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-mid)}
.version{font-size:.92rem;color:var(--ink-2);border-inline-start:3px solid var(--blue);padding-inline-start:.7rem;margin-top:.6rem}
.version b{color:var(--ink)}
.tagline{margin-top:.8rem;font-size:1.02rem;max-width:36em}

/* HUD viewport for the hero image */
.hud{position:relative;margin:0;border-radius:14px;overflow:hidden;background:#0D1117;aspect-ratio:16/9;max-width:100%;box-shadow:var(--shadow)}
.hud img{width:100%;height:100%;object-fit:cover}
.hud::before,.hud::after{content:"";position:absolute;width:2.2rem;height:2.2rem;border:2px solid #fff;opacity:.85;z-index:2;pointer-events:none}
.hud::before{top:.7rem;right:.7rem;border-left:0;border-bottom:0}
.hud::after{bottom:.7rem;left:.7rem;border-right:0;border-top:0}
.hud .scan{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0,rgb(255 255 255 / .16) 50%,transparent 100%);height:22%;animation:scan 5.5s linear infinite;pointer-events:none;mix-blend-mode:screen}
@keyframes scan{from{transform:translateY(-110%)}to{transform:translateY(520%)}}
.hud .readout{position:absolute;inset-inline-start:.9rem;bottom:.8rem;z-index:2;color:#fff;font-family:var(--font-num);font-size:.9rem;letter-spacing:.08em;text-shadow:0 1px 3px #000;direction:ltr}
.hud.empty{display:grid;place-items:center;color:#C9D3E0;font-size:.95rem;text-align:center;padding:1rem;background:linear-gradient(135deg,#0D1117,#1B2433)}

.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.7rem;margin-top:1.6rem}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.75rem .85rem .7rem;position:relative;overflow:hidden;min-width:0}
.tile::after{content:"";position:absolute;inset-inline-start:0;top:0;height:3px;width:42%;background:var(--blue)}
.tile .v{font-family:var(--font-num);font-weight:700;font-size:clamp(1.25rem,2.3vw,1.7rem);color:var(--blue);line-height:1.15;unicode-bidi:plaintext;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:.9rem;color:var(--ink-2);font-weight:600}
.tile .k{font-size:.9rem;color:var(--ink-2);font-weight:600;line-height:1.45;margin-top:.15rem}

/* ---------- panels ---------- */
main{padding-block:1.4rem 3rem}
.stack{display:grid;gap:1.3rem}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.4rem clamp(1rem,3vw,1.8rem) 1.5rem;min-width:0}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--blue);border-style:solid;pointer-events:none}
.panel::before{top:-1px;right:-1px;border-width:3px 3px 0 0;border-top-right-radius:var(--radius)}
.panel::after{bottom:-1px;left:-1px;border-width:0 0 3px 3px;border-bottom-left-radius:var(--radius)}
.p-head{display:flex;align-items:flex-start;gap:.9rem;margin-bottom:1.1rem}
.p-num{font-family:var(--font-num);font-weight:700;font-size:1.05rem;color:var(--blue);background:var(--blue-soft);border:1px solid var(--blue-mid);border-radius:10px;min-width:2.6rem;height:2.6rem;display:grid;place-items:center;flex:none}
.p-head h2{font-size:clamp(1.25rem,2.6vw,1.6rem);font-weight:700}
.p-head .lat{display:block;color:var(--ink-3);font-size:.9rem;margin-top:.1rem}
.p-lead{font-size:1.02rem;margin-bottom:1rem;max-width:62em}
.block{margin-top:1.3rem}
.block>h3{font-size:1.08rem;font-weight:700;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.block>h3::before{content:"";width:.55rem;height:.55rem;background:var(--blue);border-radius:2px;transform:rotate(45deg);flex:none}
.sec-tag{margin-top:1.2rem;padding-top:.8rem;border-top:1px dashed var(--line);font-size:.9rem;color:var(--ink-2);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

.tag{display:inline-flex;align-items:center;font-size:.9rem;font-weight:700;border-radius:999px;padding:0 .6rem;line-height:1.7;white-space:nowrap;border:1px solid transparent;vertical-align:middle}
.tag.official{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-mid)}
.tag.community{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:.9rem 1rem;background:var(--surface);min-width:0}
.card h4{font-size:1rem;font-weight:700;margin-bottom:.4rem}
.card.good{background:var(--green-soft);border-color:#CBE8DA}
.card.good h4{color:var(--green)}
.card.bad{background:var(--red-soft);border-color:#F2C9C5}
.card.bad h4{color:var(--red)}
.card.info{background:var(--blue-soft);border-color:var(--blue-mid)}
.card.info h4{color:var(--blue)}
ul.list{margin:0;padding-inline-start:1.2rem;display:grid;gap:.25rem}
ul.list li::marker{color:var(--blue)}
.card.good ul.list li::marker{color:var(--green)}
.card.bad ul.list li::marker{color:var(--red)}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:st;display:grid;gap:.55rem}
ol.steps>li{counter-increment:st;position:relative;padding-inline-start:2.6rem;min-height:2rem}
ol.steps>li::before{content:counter(st);position:absolute;inset-inline-start:0;top:.1rem;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--font-num);font-weight:700;font-size:.9rem;display:grid;place-items:center}
ol.steps>li b{display:block}
ol.steps.timeline>li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:.92rem;top:2.1rem;bottom:-.5rem;width:2px;background:var(--line)}

/* key/value table */
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1.4rem}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line);min-width:0}
.kv dt{color:var(--ink-2);font-weight:600;font-size:.95rem;min-width:0}
.kv dd{margin:0;font-weight:700;text-align:left;min-width:0;overflow-wrap:anywhere}
.kv dd .tag{margin-inline-start:.4rem}
.kv.one{grid-template-columns:minmax(0,1fr)}
.kv .hl dd{color:var(--blue);font-family:var(--font-num)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:.55rem .75rem;text-align:right;vertical-align:top;border-bottom:1px solid var(--line)}
td.wide{min-width:15rem}
td{min-width:4.5rem}
td.first{min-width:9.5rem}
thead th{background:var(--head);color:var(--on-head);font-weight:700;white-space:nowrap;position:sticky;top:0}
tbody tr:nth-child(even) td{background:var(--surface)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{font-family:var(--font-num);white-space:nowrap}
td.first{font-weight:700}
.yn{display:inline-flex;align-items:center;gap:.3rem;font-weight:700;border-radius:999px;padding:0 .55rem;font-size:.9rem;white-space:nowrap;border:1px solid transparent}
.yn.yes{background:var(--green-soft);color:var(--green);border-color:#CBE8DA}
.yn.no{background:var(--red-soft);color:var(--red);border-color:#F2C9C5}
.yn.partial{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.yn.unknown{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
.dmg{display:inline-flex;align-items:center;gap:.35rem;font-weight:700;white-space:nowrap}
.dmg::before{content:"";width:.6rem;height:.6rem;border-radius:2px;background:currentColor}
.dmg.energy{color:var(--blue)} .dmg.ballistic{color:var(--amber)} .dmg.distortion{color:var(--violet)} .dmg.explosive{color:var(--red)} .dmg.other{color:var(--ink-2)}

/* figures */
.fig{margin:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);background:#0D1117;cursor:zoom-in;position:relative}
.fig img{width:100%;aspect-ratio:16/9;object-fit:cover;transition:transform .6s ease}
.fig:hover img{transform:scale(1.03)}
.fig figcaption{background:var(--panel);padding:.5rem .8rem;font-size:.9rem;color:var(--ink-2);display:flex;gap:.5rem;justify-content:space-between;align-items:center;flex-wrap:wrap}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:.9rem;margin-block:1rem}
.lightbox{position:fixed;inset:0;z-index:100;background:rgb(10 12 16 / .9);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-height:82vh;width:auto;max-width:100%;border-radius:10px}
.lightbox p{color:#E8E6E0;text-align:center;margin-top:.7rem;font-size:.95rem}
.lightbox button{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));background:#fff;border:0;border-radius:999px;padding:.35rem .9rem;font-weight:700}

/* bars and meters */
.bars{display:grid;gap:.6rem}
.bar-row{display:grid;grid-template-columns:minmax(7rem,12rem) minmax(0,1fr) auto;gap:.8rem;align-items:center}
.bar-row .lbl{font-weight:600;font-size:.95rem;min-width:0}
.bar-row .val{font-family:var(--font-num);font-weight:700;white-space:nowrap;unicode-bidi:plaintext}
.bar{height:.75rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--blue);border-radius:999px;transform-origin:right}
.bar>i.amber{background:var(--amber)} .bar>i.green{background:var(--green)} .bar>i.red{background:var(--red)} .bar>i.ink{background:var(--ink)} .bar>i.violet{background:var(--violet)}
.play .bar>i,.bar.play>i{animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.big-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr));gap:.8rem}
.big{border:1px solid var(--line);border-radius:var(--radius-sm);padding:.8rem 1rem;background:var(--surface);min-width:0}
.big .v{font-family:var(--font-num);font-weight:700;font-size:clamp(1.5rem,3.2vw,2.1rem);color:var(--blue);line-height:1.15;unicode-bidi:plaintext;text-align:right;overflow-wrap:anywhere}
.big .v small{font-size:.9rem;color:var(--ink-2)}
.big .k{font-size:.92rem;color:var(--ink-2);font-weight:600}
.big.accent{background:var(--ink);border-color:var(--ink)}
.big.accent .v{color:#fff} .big.accent .k,.big.accent .v small{color:#C9C6BE}

.callout{border:1px solid var(--amber-line);background:var(--amber-soft);border-radius:var(--radius-sm);padding:.8rem 1rem;color:#5E3B07}
.callout b{color:var(--amber)}
.callout.blue{border-color:var(--blue-mid);background:var(--blue-soft);color:#123E6B}
.callout.blue b{color:var(--blue)}
.note{font-size:.92rem;color:var(--ink-2);margin-top:.6rem}
.formula{font-family:var(--font-num);direction:ltr;text-align:left;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:.5rem .8rem;font-size:.95rem;overflow-x:auto;white-space:nowrap}

/* radar */
.radar-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.2rem;align-items:center}
.radar svg{width:100%;height:auto;max-width:440px;display:block;margin-inline:auto;overflow:visible}
.radar .poly{transform-origin:center;transform-box:fill-box}
.play .radar .poly,.radar.play .poly{animation:pop 1.1s cubic-bezier(.2,.9,.2,1) both}
@keyframes pop{from{transform:scale(.05);opacity:.2}to{transform:scale(1);opacity:1}}
.legend{display:flex;flex-wrap:wrap;gap:.6rem 1rem;font-size:.92rem;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.legend i{width:.9rem;height:.9rem;border-radius:3px;display:inline-block}

/* calculators */
.calc{border:1px solid var(--blue-mid);background:linear-gradient(180deg,var(--blue-soft),#fff 70%);border-radius:var(--radius);padding:1.1rem clamp(.9rem,2.5vw,1.4rem);margin-top:1.2rem}
.calc-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem;flex-wrap:wrap}
.calc-head h3{font-size:1.12rem;font-weight:700}
.calc-head .chip{background:#fff}
.calc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.2rem}
.field{display:grid;gap:.3rem;margin-bottom:.8rem;min-width:0}
.field label,.field .lbl{font-weight:700;font-size:.95rem}
.field .hint{font-size:.9rem;color:var(--ink-2)}
.inp{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.45rem .7rem;min-height:2.6rem;width:100%;min-width:0}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
input[type=number].inp{font-family:var(--font-num);direction:ltr;text-align:right}
input[type=range]{width:100%;accent-color:var(--blue)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 9rem;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button,.toggle{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.3rem .85rem;font-weight:700;font-size:.9rem;transition:background .2s,color .2s,border-color .2s;display:inline-flex;gap:.4rem;align-items:center}
.seg button[aria-pressed=true],.toggle[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.seg button .n{opacity:.85}
.out{display:grid;gap:.7rem}
.out-big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.ob{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;min-width:0}
.ob .v{font-family:var(--font-num);font-weight:700;font-size:clamp(1.3rem,2.8vw,1.75rem);color:var(--blue);line-height:1.2;unicode-bidi:plaintext;text-align:right;overflow-wrap:anywhere}
.ob .v small{font-size:.9rem;color:var(--ink-2)}
.ob .k{font-size:.9rem;color:var(--ink-2);font-weight:700}
.ob.dark{background:var(--ink);border-color:var(--ink)} .ob.dark .v{color:#fff} .ob.dark .k,.ob.dark .v small{color:#C9C6BE}
.ob.good .v{color:var(--green)} .ob.bad .v{color:var(--red)}
.tank{height:1.6rem;border-radius:8px;background:#fff;border:1px solid var(--line);position:relative;overflow:hidden}
.tank .have{position:absolute;inset-block:0;inset-inline-start:0;background:var(--blue-mid);transition:width .45s ease}
.tank .need{position:absolute;inset-block:0;inset-inline-start:0;background:repeating-linear-gradient(-45deg,var(--blue) 0 6px,#2E74BD 6px 12px);transition:width .45s ease;opacity:.95}
.tank .need.over{background:repeating-linear-gradient(-45deg,var(--red) 0 6px,#C8473F 6px 12px)}

.break{width:100%;font-size:.95rem}
.break td{padding:.4rem .2rem;border-bottom:1px dashed var(--line);background:none!important}
.break td.n{text-align:left}

/* DPS picker */
.stations{display:flex;flex-wrap:wrap;gap:.45rem}
.stations .toggle .n{font-size:.9rem}

.ring-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.4rem;align-items:center}

.dial .v{font-family:var(--font-num);font-weight:700;color:var(--blue)}
.radar-sweep{width:4.4rem;height:4.4rem;border-radius:50%;border:1px solid var(--blue-mid);background:repeating-radial-gradient(circle,transparent 0 9px,rgb(27 95 163 / .12) 9px 10px);position:relative;overflow:hidden;flex:none}

.mag i.bomb{width:1rem;height:1rem;border-radius:50%;background:var(--ink)}

.crew{display:flex;flex-wrap:wrap;gap:.3rem;align-items:flex-end}

.win{color:var(--green);font-weight:700;font-size:.9rem;display:inline-flex;gap:.25rem;align-items:center}
.ruler{position:relative;display:grid;gap:.7rem}
.ruler .r{display:grid;grid-template-columns:minmax(5rem,9rem) minmax(0,1fr);gap:.7rem;align-items:center}

.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:.5rem 1rem;font-weight:700;font-family:var(--font-num);font-size:1rem}

.sheet{position:fixed;inset:auto 0 0 0;z-index:80;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -20px 50px rgb(20 20 20 / .2);max-height:80vh;overflow:auto;padding:1.1rem max(16px,env(safe-area-inset-right,0px)) max(1.2rem,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

footer{border-top:1px solid var(--line);padding-block:1.4rem 2rem;color:var(--ink-2);font-size:.92rem}

.btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--blue);color:#fff;text-decoration:none;border-radius:999px;padding:.5rem 1.1rem;font-weight:700;border:0}

      el('h3', null, 'حجم النص'), el('div', { class: 'seg' }, el('button', { type: 'button', onclick: function () { scale(6); } }, 'أكبر +'), el('button', { type: 'button', onclick: function () { scale(-6); } }, 'أصغر −'), el('button', { type: 'button', onclick: function () { store('marsad-ships:scale', null); docEl.style.fontSize = ''; } }, 'الحجم الافتراضي'))));
    function close() { sheet.remove(); scrim.remove(); document.removeEventListener('keydown', onKey); document.getElementById('open-settings').focus(); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    scrim.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(scrim); document.body.appendChild(sheet);
    sheet.querySelector('button').focus();
  }

  // ------------------------------------------------------------------ motion
  function starChart(canvas) {
    var ctx = canvas.getContext('2d'); if (!ctx) return;
    var stars = [], W = 0, H = 0, dpr = Math.min(2, window.devicePixelRatio || 1), t0 = performance.now(), running = true, raf = 0;
    function seed() {
      var r = canvas.getBoundingClientRect(); W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var count = Math.round(Math.min(220, W * H / 5200)); stars = [];
      var rnd = mulberry(7);
      for (var i = 0; i < count; i++) stars.push({ x: rnd() * W, y: rnd() * H, r: .5 + Math.pow(rnd(), 3) * 2.1, a: .18 + rnd() * .5, tw: rnd() * 6.28, sp: .4 + rnd() * 1.4, z: .2 + rnd() * .8 });
    }
    function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    function draw(now) {
      var t = (now - t0) / 1000;
      ctx.clearRect(0, 0, W, H);
      // coordinate grid like a star atlas
      ctx.strokeStyle = 'rgba(27,95,163,0.07)'; ctx.lineWidth = 1;
      var step = 72, off = REDUCED ? 0 : (t * 4) % step;
      for (var x = -step + off; x < W + step; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (var y = 0; y < H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(27,95,163,0.10)'; ctx.beginPath(); ctx.arc(W * .12, H * .9, Math.max(W, H) * .55, 0, 6.283); ctx.stroke();
      ctx.beginPath(); ctx.arc(W * .12, H * .9, Math.max(W, H) * .38, 0, 6.283); ctx.stroke();
      // constellation lines between near stars
      ctx.strokeStyle = 'rgba(20,20,20,0.06)';
      for (var i = 0; i < stars.length; i += 3) { var a = stars[i], b = stars[(i + 7) % stars.length]; var dx = a.x - b.x, dy = a.y - b.y; if (dx * dx + dy * dy < 16000) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } }
      for (var j = 0; j < stars.length; j++) {
        var s = stars[j], px = REDUCED ? s.x : (s.x + t * s.z * 3) % (W + 4), al = REDUCED ? s.a : s.a * (.65 + .35 * Math.sin(t * s.sp + s.tw));
        ctx.fillStyle = 'rgba(20,20,20,' + al.toFixed(3) + ')'; ctx.beginPath(); ctx.arc(px, s.y, s.r, 0, 6.283); ctx.fill();
        if (s.r > 2) { ctx.strokeStyle = 'rgba(27,95,163,' + (al * .5).toFixed(3) + ')'; ctx.beginPath(); ctx.moveTo(px - 5, s.y); ctx.lineTo(px + 5, s.y); ctx.moveTo(px, s.y - 5); ctx.lineTo(px, s.y + 5); ctx.stroke(); }
      }
      if (!REDUCED && running) raf = requestAnimationFrame(draw);
    }
    seed(); draw(performance.now());
    window.addEventListener('resize', function () { seed(); if (REDUCED || !running) draw(performance.now()); });
    if ('IntersectionObserver' in window && !REDUCED) new IntersectionObserver(function (es) {
      var vis = es[0].isIntersecting && !document.hidden;
      if (vis && !running) { running = true; raf = requestAnimationFrame(draw); } else if (!vis) { running = false; cancelAnimationFrame(raf); }
    }).observe(canvas);
  }

  function countUp(node) {
    var to = Number(node.getAttribute('data-to')), d = Number(node.getAttribute('data-d')) || 0;
    if (!isNum(node.getAttribute('data-to')) || REDUCED) return;
    var t0 = performance.now(), D = 1100;
    (function step(now) {
      var p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
      node.textContent = fmt(to * e, d);
      if (p < 1) requestAnimationFrame(step); else node.textContent = fmt(to, d);
    })(t0);
  }

  var IO = null;
  function observeAll(scope) {
    if (REDUCED || !('IntersectionObserver' in window)) return;
    if (!IO) IO = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        var n = e.target; IO.unobserve(n);
        n.classList.add('play');
        n.querySelectorAll('.cnt').forEach(countUp);
      });
    }, { rootMargin: '0px 0px 12% 0px' });
    (scope || document).querySelectorAll('.block, .big-stats, .radar, .ruler, .h2h').forEach(function (n) {
      var r = n.getBoundingClientRect();
      if (r.top < window.innerHeight * 0.95 && r.bottom > 0) return; // already visible: keep its resting state
      IO.observe(n);
    });
  }

  function navSpy() {
    var nav = document.getElementById('nav');
    NAV.forEach(function (n) { nav.appendChild(el('a', { href: '#' + n.id, 'data-id': n.id }, n.label)); });
    if (!('IntersectionObserver' in window)) return;
    var links = nav.querySelectorAll('a');
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        links.forEach(function (a) { var on = a.getAttribute('data-id') === e.target.id; a.classList.toggle('on', on); if (on && a.scrollIntoView && nav.scrollWidth > nav.clientWidth) { var l = a.offsetLeft - nav.clientWidth / 2 + a.clientWidth / 2; nav.scrollTo({ left: l, behavior: REDUCED ? 'auto' : 'smooth' }); } });
      });
    }, { rootMargin: '-35% 0px -60% 0px' });
    NAV.forEach(function (n) { var t = document.getElementById(n.id); if (t) io.observe(t); });
  }

  function footer() {
    var f = document.getElementById('foot');
    add(f, [el('div', null, el('b', null, 'مرصد السفن'), ' · ', 'تقرير مبني على بيانات ', el('span', { class: 'num ltr' }, META.game_version || '—'), ' · تم التحقق ', el('span', { class: 'num ltr' }, META.verified_on || '—'),
      el('p', null, 'وسمان فقط في التقرير: ', tag('official'), ' من CIG، و', tag('community'), ' لما لا ينشره المطوّر.')),
      META.gallery_url ? el('a', { class: 'btn', href: META.gallery_url, target: '_blank', rel: 'noopener' }, META.gallery_label || 'افتح المعرض الرسمي للسفينة') : null]);
    if (META.show_sources && has(META.sources)) add(f, el('details', { style: 'width:100%' }, el('summary', null, 'المراجع'), list(META.sources.map(function (s) { return s.label + ' — ' + s.url; }))));
  }

  // ------------------------------------------------------------------ boot
  applyFonts();
  document.getElementById('open-settings').addEventListener('click', openSettings);
  var canvasEl;
  if (DATA.ships.length > 1) {
    canvasEl = renderCompare(DATA.ships);
  } else {
    var ship = DATA.ships[0];
    app.appendChild(heroReport(ship));
    canvasEl = app.querySelector('.hero canvas');
    var main = el('main', { class: 'wrap stack' });
    NAV_PREFIX = '';
    main.appendChild(quickSpecs(ship));
    reportSections(ship, '').forEach(function (s) { if (s) main.appendChild(s); });
    app.appendChild(main);
  }
  footer();
  navSpy();
  if (canvasEl) starChart(canvasEl);
  document.querySelectorAll('.tiles .cnt').forEach(countUp);
  observeAll(document);
})();
</script>
