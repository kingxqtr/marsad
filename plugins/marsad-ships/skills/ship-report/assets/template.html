<title>__REPORT_TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="__REPORT_DESC__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: "Marsad ship brief" - the Marsad site identity (cool paper / night sky,
   Star Citizen blue, radar mark) as a single column of briefing cards: verdict
   first, then money, loadout, damage, rearm, costs and upgrades. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#0f1729; --ink-2:#334155; --muted:#5e6b7e;
  --line:#dfe4eb; --line-strong:#c9d1dc;
  --accent:#1f5ed6; --accent-soft:#e4ecfd; --on-accent:#ffffff;
  --mark:#b24716; --mark-soft:#fbebe2;
  --ok:#197a45; --ok-soft:#e1f3e8; --warn:#875710; --warn-soft:#fbf0dc; --bad:#b42318; --bad-soft:#fdecea;
  --energy:#1f5ed6; --ballistic:#a35f0d; --distortion:#6d4fc2; --explosive:#b42318; --pdc:#5e6b7e;
  --star:15 23 41; --grid:31 94 214;
  --shadow-sm:0 1px 2px rgb(15 23 41 / .06); --shadow-md:0 6px 20px rgb(15 23 41 / .08); --shadow-lg:0 24px 60px rgb(15 23 41 / .18);
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --radius:14px; --radius-lg:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0e15; --surface:#121823; --surface-2:#171e2b; --ink:#e9eef5; --ink-2:#c3cdda; --muted:#8c99ad;
  --line:#232c3a; --line-strong:#334052; --accent:#7fa9ff; --accent-soft:#16254a; --on-accent:#0a0e15;
  --mark:#f28a52; --mark-soft:#3a2115; --ok:#56d08a; --ok-soft:#10301f; --warn:#e9b45a; --warn-soft:#36270e; --bad:#f28b82; --bad-soft:#3a1714;
  --energy:#7fa9ff; --ballistic:#e9b45a; --distortion:#b39dff; --explosive:#f28b82; --pdc:#8c99ad;
  --star:233 238 245; --grid:127 169 255;
  --shadow-sm:0 1px 2px rgb(0 0 0 / .4); --shadow-md:0 6px 20px rgb(0 0 0 / .35); --shadow-lg:0 24px 60px rgb(0 0 0 / .55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e15; --surface:#121823; --surface-2:#171e2b; --ink:#e9eef5; --ink-2:#c3cdda; --muted:#8c99ad;
  --line:#232c3a; --line-strong:#334052; --accent:#7fa9ff; --accent-soft:#16254a; --on-accent:#0a0e15;
  --mark:#f28a52; --mark-soft:#3a2115; --ok:#56d08a; --ok-soft:#10301f; --warn:#e9b45a; --warn-soft:#36270e; --bad:#f28b82; --bad-soft:#3a1714;
  --energy:#7fa9ff; --ballistic:#e9b45a; --distortion:#b39dff; --explosive:#f28b82; --pdc:#8c99ad;
  --star:233 238 245; --grid:127 169 255;
  --shadow-sm:0 1px 2px rgb(0 0 0 / .4); --shadow-md:0 6px 20px rgb(0 0 0 / .35); --shadow-lg:0 24px 60px rgb(0 0 0 / .55);
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:8rem;font-size:106%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.wrap{width:100%;max-width:1160px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:.8rem;min-height:3.6rem}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:2.1rem;height:2.1rem}
.brand b{font-family:var(--font-display);font-size:1.08rem;display:block;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.tabs{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:.3rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;mask-image:linear-gradient(to left,#000 90%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--muted);font-size:.86rem;font-weight:600;padding:.25rem .7rem;border-radius:10px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--accent);background:var(--accent-soft)}
.act{display:flex;gap:.4rem;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:2.5rem;padding-inline:.9rem;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface);color:var(--ink);font-weight:600;font-size:.9rem;white-space:nowrap;text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn--primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn--icon{width:2.5rem;padding:0}
.btn svg{width:1.15rem;height:1.15rem}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;padding-block:2rem 1.8rem}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:2rem;align-items:center}
.eyebrow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;color:var(--accent);font-weight:600;font-size:.9rem}
.eyebrow .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--mark);box-shadow:0 0 0 0 var(--mark);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mark) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.ship-name{font-family:var(--font-display);font-weight:700;font-size:clamp(2.6rem,7vw,4.8rem);letter-spacing:-.02em;line-height:1.05;margin-block:.35rem .2rem;direction:ltr;text-align:right}
.role{font-size:1.12rem;font-weight:600}
.maker{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-block:.8rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:.12rem .7rem;font-size:.84rem;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.fresh{display:grid;gap:.2rem;margin-top:.7rem;padding:.65rem .85rem;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.88rem}
.fresh b{color:var(--ok)}
.tagline{margin-top:.6rem;color:var(--ink-2);max-width:40em}
.view{position:relative;margin:0;border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:16/9;max-width:100%;background:#0b111c;box-shadow:var(--shadow-lg)}
.view img{width:100%;height:100%;object-fit:cover}
.view .ret{position:absolute;inset:0;pointer-events:none}
.view .ret circle,.view .ret line{stroke:rgb(255 255 255 / .55);fill:none}
.view .sweep{position:absolute;width:62%;aspect-ratio:1;left:50%;top:50%;translate:-50% -50%;border-radius:50%;background:conic-gradient(from 0deg,rgb(127 169 255 / .28),transparent 22%);animation:spin 6s linear infinite;pointer-events:none;mix-blend-mode:screen}
.view .tag{position:absolute;inset-inline-start:.8rem;bottom:.7rem;color:#fff;font-size:.8rem;font-family:var(--font-display);letter-spacing:.06em;text-shadow:0 1px 3px #000;direction:ltr}
.view.empty{display:grid;place-items:center;color:#c3cdda;padding:1rem;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}

/* verdict band */
.band{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem;margin-top:1.4rem}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1rem 1.1rem;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;min-width:0}
.vc .lbl{display:flex;align-items:center;gap:.45rem;font-weight:700;color:var(--ink-2)}
.vc .lbl svg{width:1.2rem;height:1.2rem;color:var(--accent)}
.vc .big{font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,3.4vw,2.3rem);line-height:1.15;margin-top:.3rem;unicode-bidi:plaintext;text-align:right}
.vc .big small{font-size:.85rem;color:var(--muted);font-weight:600}
.vc .sub{color:var(--muted);font-size:.88rem}
.vc .meter{height:.45rem;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:.55rem;display:flex}
.vc .meter i{height:100%}
.vc p{margin-top:.5rem;font-size:.92rem;color:var(--ink-2)}
.vc.cost .row2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.4rem}
.vc.cost .pp{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:.45rem .6rem;min-width:0}
.vc.cost .pp b{display:block;font-family:var(--font-display);font-size:1.15rem;unicode-bidi:plaintext;text-align:right}
.vc.cost .pp span{font-size:.8rem;color:var(--muted)}

/* sections */
main{padding-block:1.4rem 3rem}
.stack{display:grid;gap:1.2rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.3rem clamp(1rem,3vw,1.7rem) 1.5rem;box-shadow:var(--shadow-sm);min-width:0}
.sh{display:flex;align-items:flex-start;gap:.8rem;margin-bottom:1rem}
.sh .no{font-family:var(--font-display);font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:10px;min-width:2.4rem;height:2.4rem;display:grid;place-items:center;flex:none;font-size:.95rem}
.sh h2{font-size:clamp(1.2rem,2.4vw,1.5rem)}
.sh .sub{color:var(--muted);font-size:.9rem}
.blk{margin-top:1.2rem}
.blk>h3{font-size:1.02rem;margin-bottom:.55rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.blk>h3::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--accent);flex:none}
.lead{color:var(--ink-2);max-width:65ch}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}
.box{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius);padding:.85rem 1rem;min-width:0}
.box h4{font-size:.98rem;margin-bottom:.35rem}
.box.ok{background:var(--ok-soft);border-color:transparent}.box.ok h4{color:var(--ok)}
.box.bad{background:var(--bad-soft);border-color:transparent}.box.bad h4{color:var(--bad)}
.box.acc{background:var(--accent-soft);border-color:transparent}.box.acc h4{color:var(--accent)}
.note{font-size:.86rem;color:var(--muted);margin-top:.5rem}
.notice{display:flex;gap:.6rem;padding:.75rem 1rem;border-radius:12px;background:var(--warn-soft);border:1px solid var(--line);color:var(--ink)}
.notice b{color:var(--warn)}
.notice.info{background:var(--accent-soft)}.notice.info b{color:var(--accent)}
ul.ls{margin:0;padding-inline-start:1.15rem;display:grid;gap:.2rem}
ul.ls li::marker{color:var(--accent)}
.box.ok ul.ls li::marker{color:var(--ok)}.box.bad ul.ls li::marker{color:var(--bad)}
ol.tl{list-style:none;margin:0;padding:0;display:grid;gap:.6rem;counter-reset:s}
ol.tl li{counter-increment:s;position:relative;padding-inline-start:2.6rem;min-height:2rem}
ol.tl li::before{content:counter(s);position:absolute;inset-inline-start:0;top:.05rem;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:.85rem}
ol.tl li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:.9rem;top:2.05rem;bottom:-.55rem;width:2px;background:var(--line)}
ol.tl li b{display:block}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:.55rem .7rem;text-align:right;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{background:var(--surface-2);color:var(--muted);font-weight:700;font-size:.8rem;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td{min-width:4.5rem}
td.first{font-weight:700;min-width:9rem}
td.wide{min-width:14rem}
td.n{font-family:var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem}
tr.hist td{color:var(--muted)}
.b{display:inline-flex;align-items:center;gap:.25rem;border-radius:999px;padding:0 .55rem;font-weight:700;font-size:.8rem;white-space:nowrap;line-height:1.75}
.b.yes{background:var(--ok-soft);color:var(--ok)} .b.no{background:var(--bad-soft);color:var(--bad)}
.b.partial{background:var(--warn-soft);color:var(--warn)} .b.unknown,.b.na{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.dk{display:inline-flex;align-items:center;gap:.3rem;font-weight:700;white-space:nowrap}
.dk::before{content:"";width:.55rem;height:.55rem;border-radius:2px;background:currentColor}
.dk.energy{color:var(--energy)} .dk.ballistic{color:var(--ballistic)} .dk.distortion{color:var(--distortion)} .dk.explosive{color:var(--explosive)} .dk.other{color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1.4rem}
.kv>div{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--line);min-width:0}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600;text-align:left;min-width:0;overflow-wrap:anywhere}
.src{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-inline-start:.35rem;vertical-align:middle}
.src.official{background:var(--accent)} .src.game{background:var(--ok)} .src.community{background:var(--warn)}

/* stats, bars */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11.5rem),1fr));gap:.7rem}
.st{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;min-width:0}
.st dt,.st .k{font-size:.82rem;color:var(--muted);font-weight:600}
.st .v{font-family:var(--font-display);font-weight:700;font-size:clamp(1.25rem,2.5vw,1.7rem);line-height:1.2;unicode-bidi:plaintext;text-align:right}
.st .v small{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.st.hl{background:var(--accent);border-color:var(--accent)} .st.hl .v,.st.hl .k{color:var(--on-accent)} .st.hl .v small{color:var(--on-accent);opacity:.8}
.bars{display:grid;gap:.55rem}
.bar-row{display:grid;grid-template-columns:minmax(7rem,14rem) minmax(0,1fr) auto;gap:.8rem;align-items:center}
.bar-row .l{font-weight:600;font-size:.9rem;min-width:0}
.bar-row .v{font-family:var(--font-display);font-weight:600;white-space:nowrap;unicode-bidi:plaintext}
.bar{height:.7rem;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:var(--accent);transform-origin:right;transition:width .45s ease}
.play .bar i{animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.split{display:flex;height:1.6rem;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.split i{display:grid;place-items:center;color:var(--bg);font-size:.78rem;font-weight:700;min-width:0;transition:flex-grow .45s ease;white-space:nowrap;overflow:hidden}

/* figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:.8rem;margin-top:1rem}
.fig{margin:0;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#0b111c;cursor:zoom-in}
.fig img{width:100%;aspect-ratio:16/9;object-fit:cover}
.fig figcaption{background:var(--surface);padding:.45rem .75rem;font-size:.84rem;color:var(--muted)}
.lb{position:fixed;inset:0;z-index:100;background:rgb(5 8 14 / .9);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-height:82vh;width:auto;max-width:100%;border-radius:12px}
.lb p{color:#e9eef5;text-align:center;margin-top:.6rem}
.lb button{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px))}

/* calculators */
.calc{border:1px solid var(--line-strong);border-radius:var(--radius-lg);padding:1.1rem clamp(.9rem,2.4vw,1.4rem);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 55%);margin-top:1rem}
.calc-h{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.9rem}
.calc-h h3{font-size:1.1rem}
.cg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:1.2rem}
.fld{display:grid;gap:.3rem;margin-bottom:.75rem;min-width:0}
.fld>label,.fld>.l{font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;gap:.5rem}
.fld>label output,.fld>.l output{font-family:var(--font-display);color:var(--accent);font-weight:700}
.fld .h{font-size:.82rem;color:var(--muted)}
.inp{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:.4rem .65rem;min-height:2.5rem;width:100%;min-width:0}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=number].inp{font-family:var(--font-display);direction:ltr;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:.35rem}
.seg button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:.25rem .8rem;font-weight:700;font-size:.84rem;display:inline-flex;gap:.35rem;align-items:center}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.out{display:grid;gap:.7rem;align-content:start}
.ob2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.ob{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;min-width:0}
.ob .v{font-family:var(--font-display);font-weight:700;font-size:clamp(1.2rem,2.6vw,1.6rem);line-height:1.2;unicode-bidi:plaintext;text-align:right;overflow-wrap:anywhere}
.ob .v small{font-size:.78rem;color:var(--muted)}
.ob .k{font-size:.8rem;color:var(--muted);font-weight:700}
.ob .q{font-family:var(--font-display);font-size:.95rem;color:var(--ink-2);unicode-bidi:plaintext;text-align:right}
.ob.hl{background:var(--accent);border-color:var(--accent)} .ob.hl .v,.ob.hl .k,.ob.hl .q{color:var(--on-accent)} .ob.hl .v small{color:var(--on-accent)}
.ob.good .v{color:var(--ok)} .ob.badv .v{color:var(--bad)}
.ob.hl .delta{color:var(--on-accent);opacity:.9}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:2rem;height:2.1rem;font-weight:700}
.stepper input{width:3.6rem;border:0;text-align:center;font-family:var(--font-display);background:transparent;height:2.1rem;direction:ltr}
.line-t td{padding:.4rem .3rem;background:none}
.line-t td.n{text-align:left}
.line-t tr.tot td{font-weight:700;color:var(--accent);border-bottom:0}
.donut{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center}
.donut svg{width:9.5rem;height:9.5rem;rotate:-90deg}
.donut circle{fill:none;stroke-width:16;transition:stroke-dasharray .5s ease,stroke-dashoffset .5s ease}
.legend{display:grid;gap:.25rem;font-size:.85rem}
.legend span{display:flex;align-items:center;gap:.45rem;justify-content:space-between}
.legend i{width:.75rem;height:.75rem;border-radius:3px;flex:none}
.legend em{font-style:normal;font-family:var(--font-display);font-weight:600;unicode-bidi:plaintext}
.tank{height:1.5rem;border-radius:8px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.tank .h{position:absolute;inset-block:0;inset-inline-start:0;background:color-mix(in srgb,var(--accent) 28%,transparent);transition:width .4s}
.tank .n{position:absolute;inset-block:0;inset-inline-start:0;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,color-mix(in srgb,var(--accent) 75%,#fff) 6px 12px);transition:width .4s}
.tank .n.over{background:repeating-linear-gradient(-45deg,var(--bad) 0 6px,color-mix(in srgb,var(--bad) 70%,#fff) 6px 12px)}
.trip{position:relative;height:2.3rem}
.trip .ln{position:absolute;inset-inline:1rem;top:50%;border-top:2px dashed var(--line-strong)}
.trip .pt{position:absolute;top:50%;width:.85rem;height:.85rem;border-radius:50%;translate:0 -50%;background:var(--ink)}
.trip .pt.a{inset-inline-start:.5rem}.trip .pt.b{inset-inline-end:.5rem;background:var(--mark)}
.trip .sh2{position:absolute;top:50%;inset-inline-start:1rem;width:1.3rem;height:1.3rem;margin-top:-.65rem;animation:travel 3.4s cubic-bezier(.6,0,.4,1) infinite;color:var(--accent)}
@keyframes travel{0%{inset-inline-start:1rem;opacity:0}12%{opacity:1}86%{opacity:1}100%{inset-inline-start:calc(100% - 2.3rem);opacity:0}}
.radar{width:3.6rem;height:3.6rem;border-radius:50%;border:1px solid var(--line-strong);background:repeating-radial-gradient(circle,transparent 0 8px,color-mix(in srgb,var(--accent) 14%,transparent) 8px 9px);position:relative;overflow:hidden;flex:none}
.radar::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 55%,transparent),transparent 28%);animation:spin 3.6s linear infinite}
.toggles{display:flex;flex-wrap:wrap;gap:.4rem}
.tg{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:.25rem .8rem;font-weight:700;font-size:.84rem;display:inline-flex;gap:.4rem;align-items:center}
.tg[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.slot{border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;background:var(--surface);display:grid;gap:.45rem}
.slot .top{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;font-weight:700}
.slot .meta{display:flex;flex-wrap:wrap;gap:.35rem .8rem;font-size:.84rem;color:var(--muted)}
.slot .meta b{color:var(--ink);font-family:var(--font-display)}
.delta{font-family:var(--font-display);font-weight:700;unicode-bidi:plaintext}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.mag{display:flex;flex-wrap:wrap;gap:.28rem;padding:.6rem;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);min-height:3rem}
.mag i{width:.62rem;height:1.5rem;border-radius:.3rem .3rem .12rem .12rem;background:var(--explosive);transition:transform .5s,opacity .5s}
.mag i.m{width:.48rem;height:1.15rem;background:var(--ballistic)}
.mag i.gone{transform:translateY(-1.5rem) scale(.4);opacity:0}.mag i.spent{opacity:.15}
.ring{width:min(12rem,46vw);height:auto;overflow:visible}
.ring .arc{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round}
.ring .base{fill:none;stroke:var(--accent-soft);stroke-width:10}
.ring .glow{fill:none;stroke:var(--accent);stroke-width:2;opacity:.35;transform-origin:center;transform-box:fill-box;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.5}100%{transform:scale(1.18);opacity:0}}
.dials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}
.dial{text-align:center;border:1px solid var(--line);border-radius:12px;padding:.6rem .4rem;background:var(--surface-2)}
.dial svg{width:4.3rem;height:4.3rem;display:block;margin-inline:auto}
.dial .nd{transform-origin:50px 50px;animation:spin var(--dur,20s) linear infinite}
.timeline{display:grid;gap:.5rem}
.timeline .it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.7rem;align-items:start;padding:.55rem .7rem;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.timeline .it .ver{font-family:var(--font-display);font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:0 .5rem;white-space:nowrap}
.timeline .it.up .ver{color:var(--mark);background:var(--mark-soft)}

/* share sheet */
.scrim{position:fixed;inset:0;z-index:89;background:rgb(5 8 14 / .5)}
.sheet{position:fixed;z-index:90;inset:auto 0 0 0;max-height:88vh;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);padding:1.2rem max(16px,env(safe-area-inset-right,0px)) max(1.2rem,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:760px;margin-inline:auto;display:grid;gap:.9rem}
.sheet .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.sheet .row .inp{flex:1 1 16rem;direction:ltr}
.qr{background:#fff;border-radius:14px;padding:.6rem;width:fit-content;border:1px solid var(--line)}
.qr svg{display:block;width:10rem;height:10rem}
.toast{position:fixed;z-index:120;left:50%;translate:-50% 0;bottom:max(1.2rem,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:12px;font-weight:700;box-shadow:var(--shadow-md)}

/* compare */
.vsg{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:.9rem}
.vsc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;min-width:0}
.vsc .view{border-radius:0;box-shadow:none}
.vsc .bd{padding:.7rem .9rem .9rem}
.vsc .nm{font-family:var(--font-display);font-weight:700;font-size:clamp(1.4rem,3vw,2rem);direction:ltr;text-align:right}
.ptabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.ptabs button{border:1px solid var(--line-strong);background:var(--surface);border-radius:11px;padding:.4rem 1rem;font-family:var(--font-display);font-weight:600}
.ptabs button[aria-selected=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

footer{border-top:1px solid var(--line);padding-block:1.4rem 2rem;color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:.8rem 1.4rem;align-items:center;justify-content:space-between}

@media (max-width:920px){.hero-grid,.cg{grid-template-columns:minmax(0,1fr)}.band{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  html{scroll-padding-top:9rem}
  .g2,.g3,.kv,.ob2{grid-template-columns:minmax(0,1fr)}
  .bar-row{grid-template-columns:minmax(0,1fr) auto}.bar-row .bar{grid-column:1/-1;grid-row:2}
  .brand small{display:none}.act .btn span:not(.keep){display:none}.act .btn{padding-inline:.6rem}
  .mast .wrap{flex-wrap:wrap;row-gap:.3rem;padding-block:.35rem}.tabs{order:3;flex-basis:100%}.act{margin-inline-start:auto}
  .donut{grid-template-columns:minmax(0,1fr);justify-items:center}
  .vsg{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}.trip .sh2{display:none}}
